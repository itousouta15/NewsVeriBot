[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "newsveribot"
version = "0.1.0"
description = "Evidence-first fact-checking assistant for Traditional Chinese content"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "discord.py>=2.5,<3",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "joblib>=1.5,<2",
  "pydantic-settings>=2.10,<3",
  "scikit-learn>=1.7,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
newsveribot-api = "newsveribot.api:run"
newsveribot-claims = "newsveribot.claim_cli:run"
newsveribot-discord = "newsveribot.discord_bot:run"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "types-beautifulsoup4>=4.12,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/newsveribot"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["！", "？", "％", "：", "，", "（", "）", "；"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["newsveribot"]

[[tool.mypy.overrides]]
module = ["joblib", "sklearn.*"]
ignore_missing_imports = true
